<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Car Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, rgb(19, 125, 125), #2a5298);
            font-family: 'Roboto', sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .btn-view {
            background: linear-gradient(to right, #ff6a00, #ee0979);
            border: none;
            padding: 10px 10px;
            font-size: 1.2rem;
            color: white;
            border-radius: 10px;
            transition: all 0.4s ease;
        }

        .btn-view:hover {
            background: linear-gradient(to right, #ee0979, #ff6a00);
            transform: scale(1.0);
        }

        .container {
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            font-weight: bold;
        }

        .input-group {
            margin-bottom: 1px;
        }

        .form-control {
            border-radius: 15px;
            padding: 10px;
            font-size: 1rem;
            width:450px;
            text-align: center;
            justify-content: center;
            margin-left:340px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-car"></i> View Car Details</h1>
        <div class="input-text">
            <input type="text" id="carId" class="form-control" placeholder="Enter Car ID" />
        </div>
        <button onclick="viewCarById()" class="btn-view">
            <i class="fas fa-eye"></i> View Car By ID
        </button>
        <button onclick="location.href='GetCarServletDB'" class="btn-view mt-3">
            <i class="fas fa-list"></i> Show All Cars
        </button>
    </div>

    <script>
        function viewCarById() {
            const carId = document.getElementById('carId').value;
            if (carId) {
                location.href = `GetCarServletDB?carId=${carId}`;
            } else {
                alert('Please enter a valid Car ID');
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/js/all.min.js"></script>
</body>
</html>
